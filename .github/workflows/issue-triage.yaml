name: Issue Triage

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  label:
    name: Label new issues for triage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Issue templates apply needs-triage, but issues created through the API skip templates.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const stateLabels = ['needs-triage', 'needs-more-info', 'accepted'];
            const labels = context.payload.issue.labels.map((label) => label.name);
            if (labels.some((label) => stateLabels.includes(label))) {
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: ['needs-triage'],
            });
